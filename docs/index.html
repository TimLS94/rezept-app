<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeedFamily — Legal</title>
  <style>
    :root { --navy:#0D2B63; --orange:#F57C00; --cream:#FFF9F2; --ink:#232323; --gray:#6F6F6F; --border:#EFE7DC; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { max-width:520px; margin:24px; padding:44px 36px; text-align:center; }
    h1 { font-size:34px; color:var(--navy); margin:0 0 8px; letter-spacing:.3px; }
    p { color:var(--gray); margin:0 0 32px; }
    .links { display:flex; flex-direction:column; gap:12px; }
    a.btn { display:block; padding:16px; border-radius:14px; background:#fff; border:1px solid var(--border); color:var(--navy); text-decoration:none; font-weight:600; transition:.15s; }
    a.btn:hover { border-color:var(--orange); color:var(--orange); }
    footer { margin-top:32px; color:var(--gray); font-size:13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FeedFamily</h1>
    <p>Legal &amp; policies</p>
    <div class="links">
      <a class="btn" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./terms.html">Terms of Service</a>
    </div>
    <footer>© 2026 FeedFamily</footer>
  </div>
</body>
</html>
